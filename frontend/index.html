<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Pionex OASIS - 运营活动模拟中枢</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0a0e14;
            color: #e8e8e8;
            overflow: hidden;
            height: 100vh;
        }

        /* Header */
        .header {
            background: #111a23;
            border-bottom: 1px solid #1a2332;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #1AE5A1;
            letter-spacing: 0.5px;
        }

        .header-status {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a8a8a8;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1AE5A1;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Layout */
        .container {
            display: flex;
            height: calc(100vh - 65px);
            gap: 16px;
            padding: 16px;
        }

        .panel {
            background: #111a23;
            border-radius: 8px;
            border: 1px solid #1a2332;
            display: flex;
            flex-direction: column;
        }

        /* Left Panel - Workflow */
        .left-panel {
            width: 320px;
            padding: 24px;
            gap: 20px;
        }

        .workflow-steps {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .step-card {
            background: #0a0e14;
            border: 1px solid #1a2332;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .step-card:hover {
            border-color: #1AE5A1;
            transform: translateX(4px);
        }

        .step-card.active {
            border-color: #1AE5A1;
            background: rgba(26, 229, 161, 0.05);
        }

        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #1a2332;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #1AE5A1;
            flex-shrink: 0;
        }

        .step-card.active .step-number {
            background: #1AE5A1;
            color: #0a0e14;
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            font-size: 14px;
            font-weight: 600;
            color: #e8e8e8;
            margin-bottom: 4px;
        }

        .step-desc {
            font-size: 12px;
            color: #6c6c6c;
            line-height: 1.4;
        }

        /* Form Styles */
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            color: #a8a8a8;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            background: #0a0e14;
            border: 1px solid #1a2332;
            border-radius: 6px;
            color: #e8e8e8;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1AE5A1;
            box-shadow: 0 0 0 3px rgba(26, 229, 161, 0.1);
        }

        .btn {
            padding: 14px 24px;
            background: #1AE5A1;
            color: #0a0e14;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: #15c98e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 229, 161, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn.loading {
            position: relative;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: #0a0e14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Center Panel - Canvas */
        .center-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: radial-gradient(ellipse at center, #0f141f 0%, #0a0e14 100%);
        }

        .canvas-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(17, 26, 35, 0.9);
            border: 1px solid #1a2332;
            border-radius: 8px;
            padding: 16px;
            backdrop-filter: blur(8px);
        }

        .overlay-stats {
            display: flex;
            gap: 24px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #6c6c6c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #1AE5A1;
        }

        /* Right Panel - Comments */
        .right-panel {
            width: 380px;
            padding: 0;
        }

        .panel-header {
            padding: 20px 24px;
            border-bottom: 1px solid #1a2332;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #1AE5A1;
            letter-spacing: 0.5px;
        }

        .comment-count {
            background: #1a2332;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #a8a8a8;
        }

        .comments-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comments-container::-webkit-scrollbar {
            width: 6px;
        }

        .comments-container::-webkit-scrollbar-track {
            background: #0a0e14;
        }

        .comments-container::-webkit-scrollbar-thumb {
            background: #1a2332;
            border-radius: 3px;
        }

        .comment-card {
            background: #0a0e14;
            border: 1px solid #1a2332;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1AE5A1, #0f8a65);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .comment-content {
            flex: 1;
            min-width: 0;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 12px;
        }

        .comment-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .persona-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .persona-当冲散户 { background: #ff6b6b; color: white; }
        .persona-合约大户 { background: #4ecdc4; color: white; }
        .persona-福利敏感 { background: #ffe66d; color: #0a0e14; }
        .persona-围观路人 { background: #95a5a6; color: white; }
        .persona-KOL 粉丝 { background: #a29bfe; color: white; }

        .comment-time {
            font-size: 11px;
            color: #6c6c6c;
        }

        .comment-text {
            font-size: 13px;
            color: #e8e8e8;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .sentiment-indicator {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .sentiment-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .sentiment-positive { background: #1AE5A1; }
        .sentiment-neutral { background: #ffe66d; }
        .sentiment-negative { background: #ff6b6b; }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c6c6c;
            text-align: center;
            gap: 16px;
        }

        .empty-state-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        /* Status Messages */
        .status-message {
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .status-error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }

        .status-success {
            background: rgba(26, 229, 161, 0.1);
            border: 1px solid #1AE5A1;
            color: #1AE5A1;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">🎯 Pionex OASIS</div>
        <div class="header-status">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>服务正常</span>
            </div>
            <div class="status-item">
                <span>API: </span>
                <span style="color: #1AE5A1;">pionex-oasis-poc-production.up.railway.app</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Left Panel - Workflow & Config -->
        <aside class="panel left-panel">
            <div class="workflow-steps">
                <div class="step-card active">
                    <div class="step-number">01</div>
                    <div class="step-content">
                        <div class="step-title">输入活动</div>
                        <div class="step-desc">填写运营活动文案和规则</div>
                    </div>
                </div>
                <div class="step-card">
                    <div class="step-number">02</div>
                    <div class="step-content">
                        <div class="step-title">配置画像</div>
                        <div class="step-desc">选择目标用户群体</div>
                    </div>
                </div>
                <div class="step-card">
                    <div class="step-number">03</div>
                    <div class="step-content">
                        <div class="step-title">开始推演</div>
                        <div class="step-desc">启动 AI Agent 模拟</div>
                    </div>
                </div>
                <div class="step-card">
                    <div class="step-number">04</div>
                    <div class="step-content">
                        <div class="step-title">查看报告</div>
                        <div class="step-desc">分析推演结果</div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-group">
                    <label for="activityName">活动名称</label>
                    <input type="text" id="activityName" placeholder="如：Apple Pay 首刷免费" />
                </div>

                <div class="form-group">
                    <label for="persona">目标用户</label>
                    <select id="persona">
                        <option value="all">全部（随机）</option>
                        <option value="当冲散户">当冲散户</option>
                        <option value="合约大户">合约大户</option>
                        <option value="福利敏感">福利敏感</option>
                        <option value="围观路人">围观路人</option>
                        <option value="KOL 粉丝">KOL 粉丝</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nodeCount">Agent 数量：<span id="nodeCountValue">50</span></label>
                    <input type="range" id="nodeCount" min="10" max="200" value="50" />
                </div>

                <button class="btn" id="startBtn">
                    <span>🚀 开始推演</span>
                </button>

                <div id="statusMessage"></div>
            </div>
        </aside>

        <!-- Center Panel - Canvas -->
        <main class="panel center-panel">
            <canvas id="canvas"></canvas>
            <div class="canvas-overlay">
                <div class="overlay-stats">
                    <div class="stat">
                        <div class="stat-label">活跃 Agent</div>
                        <div class="stat-value" id="activeAgents">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">已接收评论</div>
                        <div class="stat-value" id="commentCount">0</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Panel - Comments -->
        <aside class="panel right-panel">
            <div class="panel-header">
                <div class="panel-title">💬 实时评论</div>
                <div class="comment-count" id="commentCounter">0 条</div>
            </div>
            <div class="comments-container" id="commentsContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div>点击"开始推演"后<br/>实时评论将显示在这里</div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'https://pionex-oasis-poc-production.up.railway.app';
        const API_TIMEOUT = 30000;

        const PERSONA_COLORS = {
            '当冲散户': { hex: '#ff6b6b', emoji: '🔴' },
            '合约大户': { hex: '#4ecdc4', emoji: '🔵' },
            '福利敏感': { hex: '#ffe66d', emoji: '🟡' },
            '围观路人': { hex: '#95a5a6', emoji: '⚪' },
            'KOL 粉丝': { hex: '#a29bfe', emoji: '🟣' }
        };

        const MOCK_COMMENTS = [
            { text: "这活动太香了，已开卡", persona: "福利敏感", sentiment: "positive" },
            { text: "规则有点复杂，再看看", persona: "围观路人", sentiment: "neutral" },
            { text: "已绑卡，坐等免单到账", persona: "当冲散户", sentiment: "positive" },
            { text: "感觉像是套路，不太信", persona: "围观路人", sentiment: "negative" },
            { text: "手续费返还很有诚意", persona: "合约大户", sentiment: "positive" },
            { text: "已分享给朋友，一起参加", persona: "KOL 粉丝", sentiment: "positive" },
            { text: "门槛会不会太高了？", persona: "围观路人", sentiment: "neutral" },
            { text: "这个力度可以，准备参加", persona: "当冲散户", sentiment: "positive" }
        ];

        // Canvas Animation - Network Node System (like MiroFish)
        class NetworkAnimation {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.nodes = [];
                this.centerNode = null;
                this.isAnimating = false;
                this.maxNodes = 50;
                this.spawnRate = 200; // ms between spawns
                this.lastSpawnTime = 0;
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                this.centerX = this.canvas.width / 2;
                this.centerY = this.canvas.height / 2;
            }

            start(maxNodes, filterPersona = null) {
                this.maxNodes = maxNodes;
                this.nodes = [];
                this.filterPersona = filterPersona;
                
                // Create center node
                this.centerNode = {
                    x: this.centerX,
                    y: this.centerY,
                    radius: 20,
                    color: '#1AE5A1',
                    glow: true,
                    pulse: 0
                };

                this.isAnimating = true;
                this.lastSpawnTime = performance.now();
                this.animate();
            }

            spawnNode() {
                if (this.nodes.length >= this.maxNodes) return;

                const personas = Object.keys(PERSONA_COLORS);
                const persona = this.filterPersona || personas[Math.floor(Math.random() * personas.length)];
                const color = PERSONA_COLORS[persona];

                // Random angle for spawn direction
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 20; // Start close to center

                this.nodes.push({
                    x: this.centerX + Math.cos(angle) * distance,
                    y: this.centerY + Math.sin(angle) * distance,
                    vx: Math.cos(angle) * 0.3, // Slow outward movement
                    vy: Math.sin(angle) * 0.3,
                    radius: 6 + Math.random() * 4,
                    color: color.hex,
                    persona: persona,
                    life: 1,
                    connected: true
                });
            }

            animate(currentTime = 0) {
                if (!this.isAnimating) return;

                // Clear canvas with fade effect
                this.ctx.fillStyle = 'rgba(10, 14, 20, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Spawn new nodes
                if (currentTime - this.lastSpawnTime > this.spawnRate) {
                    this.spawnNode();
                    this.lastSpawnTime = currentTime;
                }

                // Draw connections first (so they're behind nodes)
                this.ctx.strokeStyle = 'rgba(26, 229, 161, 0.15)';
                this.ctx.lineWidth = 1;
                for (const node of this.nodes) {
                    if (node.connected && this.centerNode) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(node.x, node.y);
                        this.ctx.lineTo(this.centerNode.x, this.centerNode.y);
                        this.ctx.stroke();
                    }
                }

                // Draw center node
                if (this.centerNode) {
                    this.centerNode.pulse += 0.05;
                    const pulseRadius = this.centerNode.radius + Math.sin(this.centerNode.pulse) * 3;
                    
                    // Glow effect
                    const gradient = this.ctx.createRadialGradient(
                        this.centerNode.x, this.centerNode.y, 0,
                        this.centerNode.x, this.centerNode.y, pulseRadius * 2
                    );
                    gradient.addColorStop(0, 'rgba(26, 229, 161, 0.3)');
                    gradient.addColorStop(1, 'rgba(26, 229, 161, 0)');
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(this.centerNode.x, this.centerNode.y, pulseRadius * 2, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Main center node
                    this.ctx.fillStyle = this.centerNode.color;
                    this.ctx.beginPath();
                    this.ctx.arc(this.centerNode.x, this.centerNode.y, pulseRadius, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                // Draw and update nodes
                for (let i = this.nodes.length - 1; i >= 0; i--) {
                    const node = this.nodes[i];
                    
                    // Move node outward
                    node.x += node.vx;
                    node.y += node.vy;

                    // Draw node
                    this.ctx.fillStyle = node.color;
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Remove nodes that go off screen
                    if (node.x < -50 || node.x > this.canvas.width + 50 ||
                        node.y < -50 || node.y > this.canvas.height + 50) {
                        this.nodes.splice(i, 1);
                    }
                }

                // Update stats
                document.getElementById('activeAgents').textContent = this.nodes.length;

                requestAnimationFrame(() => this.animate(performance.now()));
            }

            stop() {
                this.isAnimating = false;
            }
        }

        // Initialize
        const canvas = document.getElementById('canvas');
        const nodeAnim = new NetworkAnimation(canvas);
        const startBtn = document.getElementById('startBtn');
        const activityNameInput = document.getElementById('activityName');
        const personaSelect = document.getElementById('persona');
        const nodeCountInput = document.getElementById('nodeCount');
        const nodeCountValue = document.getElementById('nodeCountValue');
        const commentsContainer = document.getElementById('commentsContainer');
        const commentCounter = document.getElementById('commentCounter');
        const statusMessage = document.getElementById('statusMessage');

        // Update node count display
        nodeCountInput.addEventListener('input', () => {
            nodeCountValue.textContent = nodeCountInput.value;
            nodeAnim.spawnRate = Math.max(50, 300 - nodeCountInput.value * 2); // Faster spawn for more nodes
        });

        // Helper functions
        function showError(message) {
            statusMessage.innerHTML = `<div class="status-message status-error">${message}</div>`;
            setTimeout(() => statusMessage.innerHTML = '', 5000);
        }

        function showSuccess(message) {
            statusMessage.innerHTML = `<div class="status-message status-success">${message}</div>`;
            setTimeout(() => statusMessage.innerHTML = '', 5000);
        }

        function clearComments() {
            commentsContainer.innerHTML = '';
            document.getElementById('commentCount').textContent = '0';
            commentCounter.textContent = '0 条';
        }

        function addComment(comment) {
            if (commentsContainer.querySelector('.empty-state')) {
                clearComments();
            }

            const persona = comment.persona || Object.keys(PERSONA_COLORS)[Math.floor(Math.random() * 5)];
            const color = PERSONA_COLORS[persona];
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            const card = document.createElement('div');
            card.className = 'comment-card';
            card.innerHTML = `
                <div class="comment-avatar">${color.emoji}</div>
                <div class="comment-content">
                    <div class="comment-header">
                        <div class="comment-meta">
                            <span class="persona-badge persona-${persona}">${persona}</span>
                            <span class="comment-time">${time}</span>
                        </div>
                    </div>
                    <div class="comment-text">${comment.content || comment.text}</div>
                    <div class="sentiment-indicator">
                        <div class="sentiment-dot sentiment-${comment.sentiment || 'positive'}"></div>
                    </div>
                </div>
            `;

            commentsContainer.appendChild(card);
            commentsContainer.scrollTop = commentsContainer.scrollHeight;

            const count = commentsContainer.querySelectorAll('.comment-card').length;
            document.getElementById('commentCount').textContent = count;
            commentCounter.textContent = `${count}条`;
        }

        // Start simulation
        let abortController = null;

        startBtn.addEventListener('click', async () => {
            const activityName = activityNameInput.value.trim();
            const persona = personaSelect.value;
            const nodeCount = parseInt(nodeCountInput.value);

            if (!activityName) {
                showError('❌ 请输入活动名称');
                return;
            }

            if (nodeCount < 10 || nodeCount > 200) {
                showError('❌ Agent 数量必须在 10-200 之间');
                return;
            }

            clearComments();
            startBtn.disabled = true;
            startBtn.classList.add('loading');
            startBtn.querySelector('span').textContent = '推演中...';

            // Start network animation
            nodeAnim.start(nodeCount, persona === 'all' ? null : persona);

            try {
                abortController = new AbortController();
                const timeoutId = setTimeout(() => abortController.abort(), API_TIMEOUT);

                const response = await fetch(`${API_BASE_URL}/api/simulate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        campaign_id: activityName,
                        scenario: persona === 'all' ? 'all' : persona,
                        agents_count: nodeCount
                    }),
                    signal: abortController.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`服务器错误 (${response.status})`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'complete') {
                                    showSuccess(`✅ 推演完成，共收到 ${data.total || commentsContainer.querySelectorAll('.comment-card').length} 条评论`);
                                    nodeAnim.stop();
                                } else if (data.content) {
                                    addComment({
                                        content: data.content,
                                        persona: Object.keys(PERSONA_COLORS)[Math.floor(Math.random() * 5)],
                                        sentiment: 'positive'
                                    });
                                }
                            } catch (e) {
                                console.error('Parse error:', e);
                            }
                        }
                    }
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    showError('⏱️ 请求超时，请稍后重试');
                } else {
                    showError(`❌ ${error.message}`);
                }
                nodeAnim.stop();
            } finally {
                startBtn.disabled = false;
                startBtn.classList.remove('loading');
                startBtn.querySelector('span').textContent = '🚀 开始推演';
            }
        });

        // Enter key to start
        activityNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !startBtn.disabled) {
                startBtn.click();
            }
        });
    </script>
</body>
</html>
