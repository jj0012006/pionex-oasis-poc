<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pionex OASIS | Social Network Simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00DC82;
            --bg-dark: #0A0E1A;
            --text-primary: #F9FAFB;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .header {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(55, 65, 81, 0.5);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #00DC82, #00A86B);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #00DC82, #00A86B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            display: grid;
            grid-template-columns: 360px 1fr 440px;
            gap: 20px;
            height: calc(100vh - 81px);
            padding: 20px;
        }

        .panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(55, 65, 81, 0.5);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 24px;
            border-bottom: 1px solid rgba(55, 65, 81, 0.5);
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .panel-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .panel-content {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }

        .workflow-steps {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .step-card {
            background: rgba(31, 41, 55, 0.3);
            border: 1px solid rgba(55, 65, 81, 0.5);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .step-card:hover {
            background: rgba(31, 41, 55, 0.5);
            border-color: rgba(0, 220, 130, 0.3);
            transform: translateX(8px);
        }

        .step-card.active {
            background: rgba(0, 220, 130, 0.06);
            border-color: rgba(0, 220, 130, 0.3);
        }

        .step-number {
            width: 44px; height: 44px;
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(55, 65, 81, 0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .step-card.active .step-number {
            background: linear-gradient(135deg, #00DC82, #00A86B);
            color: var(--bg-dark);
        }

        .step-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .step-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .form-input, .form-select {
            padding: 14px 18px;
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid rgba(55, 65, 81, 0.5);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #00DC82;
        }

        .range-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .range-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: rgba(55, 65, 81, 0.5);
            border-radius: 3px;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px; height: 20px;
            background: linear-gradient(135deg, #00DC82, #00A86B);
            border-radius: 50%;
            cursor: pointer;
        }

        .range-value {
            min-width: 50px;
            text-align: right;
            font-size: 14px;
            font-weight: 700;
            color: #00DC82;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, #00DC82, #00A86B);
            color: var(--bg-dark);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 220, 130, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.loading { pointer-events: none; }

        .btn-loading-spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(10, 14, 26, 0.3);
            border-top-color: var(--bg-dark);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .center-panel {
            position: relative;
            background: #0A0E1A;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .canvas-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(55, 65, 81, 0.5);
            border-radius: 14px;
            padding: 18px 24px;
            display: flex;
            gap: 40px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #00DC82;
            font-family: 'JetBrains Mono', monospace;
        }

        .right-panel { background: rgba(17, 24, 39, 0.85); }

        .comments-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(55, 65, 81, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comments-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .comments-count {
            background: rgba(0, 220, 130, 0.1);
            border: 1px solid rgba(0, 220, 130, 0.3);
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            color: #00DC82;
        }

        .comments-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .comment-card {
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid rgba(55, 65, 81, 0.5);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            gap: 16px;
        }

        .comment-avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00DC82, #00A86B);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .comment-content { flex: 1; }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .persona-badge {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .persona-当冲散户 { background: rgba(239, 68, 68, 0.15); color: #FCA5A5; }
        .persona-合约大户 { background: rgba(14, 165, 233, 0.15); color: #7DD3FC; }
        .persona-福利敏感 { background: rgba(245, 158, 11, 0.15); color: #FCD34D; }
        .persona-围观路人 { background: rgba(107, 114, 128, 0.15); color: #D1D5DB; }
        .persona-KOL 粉丝 { background: rgba(139, 92, 246, 0.15); color: #C4B5FD; }

        .comment-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .comment-text {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 24px;
        }

        .empty-state-icon {
            font-size: 64px;
            opacity: 0.15;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🎯</div>
            <div class="logo-text">Pionex OASIS</div>
        </div>
    </header>

    <div class="container">
        <aside class="panel left-panel">
            <div class="panel-header">
                <div class="panel-title">Configuration</div>
                <div class="panel-subtitle">Set up simulation parameters</div>
            </div>
            <div class="panel-content">
                <div class="workflow-steps">
                    <div class="step-card active">
                        <div class="step-number">01</div>
                        <div class="step-content">
                            <div class="step-title">Campaign Input</div>
                            <div class="step-desc">Define campaign details</div>
                        </div>
                    </div>
                    <div class="step-card">
                        <div class="step-number">02</div>
                        <div class="step-content">
                            <div class="step-title">Audience</div>
                            <div class="step-desc">Choose target segment</div>
                        </div>
                    </div>
                    <div class="step-card">
                        <div class="step-number">03</div>
                        <div class="step-content">
                            <div class="step-title">Launch</div>
                            <div class="step-desc">Start simulation</div>
                        </div>
                    </div>
                    <div class="step-card">
                        <div class="step-number">04</div>
                        <div class="step-content">
                            <div class="step-title">Analyze</div>
                            <div class="step-desc">Review results</div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-group">
                        <label class="form-label">Campaign Name</label>
                        <input type="text" class="form-input" id="activityName" placeholder="e.g., Apple Pay Campaign" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Target Audience</label>
                        <select class="form-select" id="persona">
                            <option value="all">All Segments</option>
                            <option value="当冲散户">Day Traders</option>
                            <option value="合约大户">Contract Whales</option>
                            <option value="福利敏感">Bonus Hunters</option>
                            <option value="围观路人">Observers</option>
                            <option value="KOL 粉丝">KOL Followers</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Agent Count</label>
                        <div class="range-wrapper">
                            <input type="range" class="range-slider" id="nodeCount" min="10" max="200" value="50" />
                            <div class="range-value" id="nodeCountValue">50</div>
                        </div>
                    </div>

                    <button class="btn" id="startBtn">
                        <span>🚀 Launch Simulation</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="panel center-panel">
            <canvas id="canvas"></canvas>
            <div class="canvas-overlay">
                <div class="stat-item">
                    <div class="stat-label">Active Users</div>
                    <div class="stat-value" id="activeAgents">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Comments</div>
                    <div class="stat-value" id="commentCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Connections</div>
                    <div class="stat-value" id="networkNodes">0</div>
                </div>
            </div>
        </main>

        <aside class="panel right-panel">
            <div class="comments-header">
                <div class="comments-title">Live Feedback</div>
                <div class="comments-count" id="commentCounter">0</div>
            </div>
            <div class="comments-container" id="commentsContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div>Click "Launch Simulation"<br/>to see real-time feedback</div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const API_BASE_URL = 'https://pionex-oasis-poc-production.up.railway.app';
        const PERSONA_COLORS = {
            '当冲散户': '#EF4444',
            '合约大户': '#0EA5E9',
            '福利敏感': '#F59E0B',
            '围观路人': '#6B7280',
            'KOL 粉丝': '#8B5CF6'
        };

        class SocialNetworkAnimation {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.nodes = [];
                this.connections = [];
                this.isAnimating = false;
                this.maxNodes = 50;
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            start(maxNodes) {
                this.maxNodes = maxNodes;
                this.nodes = [];
                this.connections = [];
                this.isAnimating = true;
                this.animate();
            }

            addUser(persona, influence = 1) {
                if (this.nodes.length >= this.maxNodes) {
                    this.nodes.shift();
                }

                const color = PERSONA_COLORS[persona] || '#6B7280';
                
                // User node with influence-based size
                const node = {
                    x: Math.random() * (this.canvas.width - 100) + 50,
                    y: Math.random() * (this.canvas.height - 100) + 50,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: 8 + influence * 6,
                    color: color,
                    persona: persona,
                    influence: influence,
                    life: 1
                };

                this.nodes.push(node);

                // Create connections to nearby users (social network)
                const nearbyNodes = this.nodes.filter((n, i) => 
                    i < this.nodes.length - 1 && 
                    Math.hypot(n.x - node.x, n.y - node.y) < 150
                );

                for (const nearby of nearbyNodes) {
                    this.connections.push({
                        from: node,
                        to: nearby,
                        life: 1,
                        width: 1 + Math.min(influence, nearby.influence) * 0.5
                    });
                }
            }

            animate() {
                if (!this.isAnimating) return;

                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.fillStyle = '#0A0E1A';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw connections first (behind nodes)
                for (let i = this.connections.length - 1; i >= 0; i--) {
                    const conn = this.connections[i];
                    
                    if (!conn.from || !conn.to || conn.from.life < 0.1 || conn.to.life < 0.1) {
                        this.connections.splice(i, 1);
                        continue;
                    }

                    const gradient = this.ctx.createLinearGradient(
                        conn.from.x, conn.from.y,
                        conn.to.x, conn.to.y
                    );
                    gradient.addColorStop(0, conn.from.color + '40');
                    gradient.addColorStop(1, conn.to.color + '40');
                    
                    this.ctx.strokeStyle = gradient;
                    this.ctx.lineWidth = conn.width;
                    this.ctx.beginPath();
                    this.ctx.moveTo(conn.from.x, conn.from.y);
                    this.ctx.lineTo(conn.to.x, conn.to.y);
                    this.ctx.stroke();

                    conn.life *= 0.995;
                }

                // Draw and update nodes
                for (let i = this.nodes.length - 1; i >= 0; i--) {
                    const node = this.nodes[i];
                    
                    // Slow drift
                    node.x += node.vx;
                    node.y += node.vy;
                    node.life *= 0.998;

                    // Bounce off walls
                    if (node.x < node.radius || node.x > this.canvas.width - node.radius) {
                        node.vx *= -1;
                    }
                    if (node.y < node.radius || node.y > this.canvas.height - node.radius) {
                        node.vy *= -1;
                    }

                    // Draw node with glow
                    const gradient = this.ctx.createRadialGradient(
                        node.x, node.y, 0,
                        node.x, node.y, node.radius * 2
                    );
                    gradient.addColorStop(0, node.color);
                    gradient.addColorStop(0.5, node.color + '80');
                    gradient.addColorStop(1, 'transparent');
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, node.radius * 2, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Core
                    this.ctx.fillStyle = node.color;
                    this.ctx.globalAlpha = node.life;
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1;

                    // Remove dead nodes
                    if (node.life < 0.05) {
                        this.nodes.splice(i, 1);
                        this.connections = this.connections.filter(c => c.from !== node && c.to !== node);
                    }
                }

                // Update stats
                document.getElementById('activeAgents').textContent = this.nodes.length;
                document.getElementById('networkNodes').textContent = this.connections.length;

                requestAnimationFrame(() => this.animate());
            }

            stop() {
                this.isAnimating = false;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }

        const canvas = document.getElementById('canvas');
        const nodeAnim = new SocialNetworkAnimation(canvas);
        const startBtn = document.getElementById('startBtn');
        const activityNameInput = document.getElementById('activityName');
        const personaSelect = document.getElementById('persona');
        const nodeCountInput = document.getElementById('nodeCount');
        const nodeCountValue = document.getElementById('nodeCountValue');
        const commentsContainer = document.getElementById('commentsContainer');
        const commentCounter = document.getElementById('commentCounter');

        nodeCountInput.addEventListener('input', () => {
            nodeCountValue.textContent = nodeCountInput.value;
        });

        function clearComments() {
            commentsContainer.innerHTML = '';
            document.getElementById('commentCount').textContent = '0';
            commentCounter.textContent = '0';
        }

        function addComment(comment) {
            if (commentsContainer.querySelector('.empty-state')) clearComments();

            const persona = comment.persona || Object.keys(PERSONA_COLORS)[Math.floor(Math.random() * 5)];
            const influence = 0.5 + Math.random() * 1; // Random influence for demo
            const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

            const card = document.createElement('div');
            card.className = 'comment-card';
            card.innerHTML = `
                <div class="comment-avatar">${persona.charAt(0)}</div>
                <div class="comment-content">
                    <div class="comment-header">
                        <div>
                            <span class="persona-badge persona-${persona}">${persona}</span>
                            <span class="comment-time" style="margin-left: 8px;">${time}</span>
                        </div>
                    </div>
                    <div class="comment-text">${comment.content}</div>
                </div>
            `;

            commentsContainer.appendChild(card);
            commentsContainer.scrollTop = commentsContainer.scrollHeight;

            const count = commentsContainer.querySelectorAll('.comment-card').length;
            document.getElementById('commentCount').textContent = count;
            commentCounter.textContent = count;

            // Add user to social network
            nodeAnim.addUser(persona, influence);
        }

        startBtn.addEventListener('click', async () => {
            const activityName = activityNameInput.value.trim();
            const persona = personaSelect.value;
            const nodeCount = parseInt(nodeCountInput.value);

            if (!activityName) { alert('Please enter campaign name'); return; }

            clearComments();
            startBtn.disabled = true;
            startBtn.classList.add('loading');
            startBtn.querySelector('span').innerHTML = '<div class="btn-loading-spinner"></div> Simulating...';

            nodeAnim.start(nodeCount);

            try {
                const response = await fetch(`${API_BASE_URL}/api/simulate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        campaign_id: activityName,
                        scenario: persona === 'all' ? 'all' : persona,
                        agents_count: nodeCount
                    })
                });

                if (!response.ok) throw new Error(`Server error (${response.status})`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            if (data.content) {
                                addComment({
                                    content: data.content,
                                    persona: Object.keys(PERSONA_COLORS)[Math.floor(Math.random() * 5)]
                                });
                            }
                        }
                    }
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                startBtn.disabled = false;
                startBtn.classList.remove('loading');
                startBtn.querySelector('span').textContent = '🚀 Launch Simulation';
            }
        });

        activityNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startBtn.click();
        });
    </script>
</body>
</html>
