<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Pionex OASIS - 多 Agent 模拟中枢</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0a0e14; color: #e8e8e8; overflow: hidden; height: 100vh;
        }
        .header {
            background: #111a23; border-bottom: 1px solid #1a2332;
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 20px; font-weight: 700; color: #1AE5A1; letter-spacing: 0.5px; }
        .header-status { display: flex; gap: 24px; align-items: center; }
        .status-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a8a8a8; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #1AE5A1; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .container { display: flex; height: calc(100vh - 65px); gap: 16px; padding: 16px; }
        .panel { background: #111a23; border-radius: 8px; border: 1px solid #1a2332; display: flex; flex-direction: column; }
        .left-panel { width: 320px; padding: 24px; gap: 20px; }
        .workflow-steps { display: flex; flex-direction: column; gap: 16px; }
        .step-card {
            background: #0a0e14; border: 1px solid #1a2332; border-radius: 8px; padding: 16px;
            display: flex; gap: 16px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .step-card:hover { border-color: #1AE5A1; transform: translateX(8px); box-shadow: 0 0 20px rgba(26, 229, 161, 0.2); }
        .step-card.active { border-color: #1AE5A1; background: rgba(26, 229, 161, 0.08); box-shadow: 0 0 24px rgba(26, 229, 161, 0.15); }
        .step-number {
            width: 48px; height: 48px; border-radius: 10px; background: #1a2332;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: #1AE5A1; flex-shrink: 0;
            transition: all 0.3s;
        }
        .step-card.active .step-number { background: linear-gradient(135deg, #1AE5A1, #0f8a65); color: #0a0e14; box-shadow: 0 4px 16px rgba(26, 229, 161, 0.4); }
        .step-content { flex: 1; }
        .step-title { font-size: 14px; font-weight: 600; color: #e8e8e8; margin-bottom: 4px; }
        .step-desc { font-size: 12px; color: #6c6c6c; line-height: 1.4; }
        .form-section { display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; color: #a8a8a8; font-weight: 500; }
        .form-group input, .form-group select {
            padding: 12px; background: #0a0e14; border: 1px solid #1a2332; border-radius: 6px;
            color: #e8e8e8; font-size: 14px; font-family: inherit; transition: all 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: #1AE5A1;
            box-shadow: 0 0 0 3px rgba(26, 229, 161, 0.15), 0 0 20px rgba(26, 229, 161, 0.1);
        }
        .btn {
            padding: 16px 28px; background: linear-gradient(135deg, #1AE5A1, #0f8a65);
            color: #0a0e14; border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(26, 229, 161, 0.4), 0 0 40px rgba(26, 229, 161, 0.2);
        }
        .btn:active { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; filter: grayscale(0.5); }
        .btn.loading { position: relative; pointer-events: none; }
        .btn.loading::after {
            content: ''; position: absolute; width: 20px; height: 20px;
            border: 3px solid transparent; border-top-color: #0a0e14; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .center-panel { flex: 1; position: relative; overflow: hidden; background: radial-gradient(ellipse at center, #0f141f 0%, #0a0e14 100%); }
        #canvas { width: 100%; height: 100%; display: block; }
        .canvas-overlay {
            position: absolute; top: 20px; left: 20px;
            background: rgba(17, 26, 35, 0.95); border: 1px solid #1a2332;
            border-radius: 10px; padding: 18px 22px;
            backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 40px rgba(26, 229, 161, 0.1);
        }
        .overlay-stats { display: flex; gap: 32px; }
        .stat { display: flex; flex-direction: column; gap: 6px; }
        .stat-label { font-size: 11px; color: #6c6c6c; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .stat-value { font-size: 24px; font-weight: 700; color: #1AE5A1; text-shadow: 0 0 20px rgba(26, 229, 161, 0.4); font-family: 'Courier New', monospace; }
        .right-panel { width: 400px; padding: 0; }
        .panel-header {
            padding: 20px 24px; border-bottom: 1px solid #1a2332;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(90deg, rgba(26, 229, 161, 0.05), transparent);
        }
        .panel-title { font-size: 15px; font-weight: 700; color: #1AE5A1; letter-spacing: 0.8px; text-transform: uppercase; }
        .comment-count {
            background: linear-gradient(135deg, #1a2332, #0f141f);
            padding: 6px 16px; border-radius: 16px; font-size: 13px;
            color: #1AE5A1; font-weight: 600; border: 1px solid #1AE5A1;
        }
        .comments-container {
            flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px;
        }
        .comments-container::-webkit-scrollbar { width: 6px; }
        .comments-container::-webkit-scrollbar-track { background: #0a0e14; }
        .comments-container::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1AE5A1, #0f8a65); border-radius: 3px; }
        .comment-card {
            background: linear-gradient(135deg, rgba(17, 26, 35, 0.9), rgba(10, 14, 20, 0.95));
            border: 1px solid #1a2332; border-radius: 10px; padding: 18px;
            display: flex; gap: 14px; animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative; overflow: hidden;
        }
        .comment-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(180deg, #1AE5A1, #0f8a65);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        .comment-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #1AE5A1, #0f8a65);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(26, 229, 161, 0.3);
            animation: avatarPop 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes avatarPop {
            from { transform: scale(0); }
            70% { transform: scale(1.1); }
            to { transform: scale(1); }
        }
        .comment-content { flex: 1; min-width: 0; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 12px; flex-wrap: wrap; }
        .comment-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .persona-badge {
            padding: 4px 12px; border-radius: 6px; font-size: 11px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .persona-当冲散户 { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: white; box-shadow: 0 2px 12px rgba(255, 107, 107, 0.3); }
        .persona-合约大户 { background: linear-gradient(135deg, #4ecdc4, #44a3a0); color: white; box-shadow: 0 2px 12px rgba(78, 205, 196, 0.3); }
        .persona-福利敏感 { background: linear-gradient(135deg, #ffe66d, #ffd93d); color: #0a0e14; box-shadow: 0 2px 12px rgba(255, 230, 109, 0.3); }
        .persona-围观路人 { background: linear-gradient(135deg, #95a5a6, #7f8c8d); color: white; box-shadow: 0 2px 12px rgba(149, 165, 166, 0.3); }
        .persona-KOL 粉丝 { background: linear-gradient(135deg, #a29bfe, #9189f8); color: white; box-shadow: 0 2px 12px rgba(162, 155, 254, 0.3); }
        .comment-time { font-size: 11px; color: #6c6c6c; font-family: 'Courier New', monospace; }
        .comment-text { font-size: 14px; color: #e8e8e8; line-height: 1.6; word-wrap: break-word; font-weight: 400; }
        .sentiment-indicator { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
        .sentiment-label { font-size: 11px; color: #6c6c6c; text-transform: uppercase; letter-spacing: 0.5px; }
        .sentiment-bar { flex: 1; height: 6px; background: #1a2332; border-radius: 3px; overflow: hidden; display: flex; }
        .sentiment-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .sentiment-positive { background: linear-gradient(90deg, #1AE5A1, #0f8a65); box-shadow: 0 0 10px rgba(26, 229, 161, 0.4); }
        .sentiment-neutral { background: linear-gradient(90deg, #ffe66d, #ffd93d); box-shadow: 0 0 10px rgba(255, 230, 109, 0.4); }
        .sentiment-negative { background: linear-gradient(90deg, #ff6b6b, #ee5a5a); box-shadow: 0 0 10px rgba(255, 107, 107, 0.4); }
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: #6c6c6c; text-align: center; gap: 20px; padding: 40px;
        }
        .empty-state-icon { font-size: 64px; opacity: 0.3; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .status-message { padding: 14px 18px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .status-error { background: rgba(255, 107, 107, 0.12); border: 1px solid #ff6b6b; color: #ff8a8a; }
        .status-success { background: rgba(26, 229, 161, 0.12); border: 1px solid #1AE5A1; color: #5ce6c4; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">🎯 Pionex OASIS</div>
        <div class="header-status">
            <div class="status-item"><div class="status-dot"></div><span>服务正常</span></div>
            <div class="status-item"><span>API: </span><span style="color: #1AE5A1;">pionex-oasis-poc-production.up.railway.app</span></div>
        </div>
    </header>
    <div class="container">
        <aside class="panel left-panel">
            <div class="workflow-steps">
                <div class="step-card active">
                    <div class="step-number">01</div>
                    <div class="step-content"><div class="step-title">输入活动</div><div class="step-desc">填写运营活动文案和规则</div></div>
                </div>
                <div class="step-card">
                    <div class="step-number">02</div>
                    <div class="step-content"><div class="step-title">配置画像</div><div class="step-desc">选择目标用户群体</div></div>
                </div>
                <div class="step-card">
                    <div class="step-number">03</div>
                    <div class="step-content"><div class="step-title">开始推演</div><div class="step-desc">启动 AI Agent 模拟</div></div>
                </div>
                <div class="step-card">
                    <div class="step-number">04</div>
                    <div class="step-content"><div class="step-title">查看报告</div><div class="step-desc">分析推演结果</div></div>
                </div>
            </div>
            <div class="form-section">
                <div class="form-group">
                    <label for="activityName">活动名称</label>
                    <input type="text" id="activityName" placeholder="如：Apple Pay 首刷免费" />
                </div>
                <div class="form-group">
                    <label for="persona">目标用户</label>
                    <select id="persona">
                        <option value="all">全部（随机）</option>
                        <option value="当冲散户">当冲散户</option>
                        <option value="合约大户">合约大户</option>
                        <option value="福利敏感">福利敏感</option>
                        <option value="围观路人">围观路人</option>
                        <option value="KOL 粉丝">KOL 粉丝</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nodeCount">Agent 数量：<span id="nodeCountValue">50</span></label>
                    <input type="range" id="nodeCount" min="10" max="200" value="50" />
                </div>
                <button class="btn" id="startBtn"><span>🚀 开始推演</span></button>
                <div id="statusMessage"></div>
            </div>
        </aside>
        <main class="panel center-panel">
            <canvas id="canvas"></canvas>
            <div class="canvas-overlay">
                <div class="overlay-stats">
                    <div class="stat"><div class="stat-label">活跃 Agent</div><div class="stat-value" id="activeAgents">0</div></div>
                    <div class="stat"><div class="stat-label">已接收评论</div><div class="stat-value" id="commentCount">0</div></div>
                    <div class="stat"><div class="stat-label">网络节点</div><div class="stat-value" id="networkNodes">0</div></div>
                </div>
            </div>
        </main>
        <aside class="panel right-panel">
            <div class="panel-header">
                <div class="panel-title">💬 实时评论</div>
                <div class="comment-count" id="commentCounter">0 条</div>
            </div>
            <div class="comments-container" id="commentsContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div>点击"开始推演"后<br/>实时评论将显示在这里</div>
                </div>
            </div>
        </aside>
    </div>
    <script>
        const API_BASE_URL = 'https://pionex-oasis-poc-production.up.railway.app';
        const API_TIMEOUT = 30000;
        const PERSONA_COLORS = {
            '当冲散户': { hex: '#ff6b6b', emoji: '🔴', gradient: ['#ff6b6b', '#ee5a5a'] },
            '合约大户': { hex: '#4ecdc4', emoji: '🔵', gradient: ['#4ecdc4', '#44a3a0'] },
            '福利敏感': { hex: '#ffe66d', emoji: '🟡', gradient: ['#ffe66d', '#ffd93d'] },
            '围观路人': { hex: '#95a5a6', emoji: '⚪', gradient: ['#95a5a6', '#7f8c8d'] },
            'KOL 粉丝': { hex: '#a29bfe', emoji: '🟣', gradient: ['#a29bfe', '#9189f8'] }
        };

        // Advanced Network Animation with Real-time Data Sync
        class NetworkAnimation {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.nodes = [];
                this.connections = [];
                this.centerNode = null;
                this.isAnimating = false;
                this.maxNodes = 50;
                this.commentCount = 0;
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                this.centerX = this.canvas.width / 2;
                this.centerY = this.canvas.height / 2;
            }

            start(maxNodes, filterPersona = null) {
                this.maxNodes = maxNodes;
                this.nodes = [];
                this.connections = [];
                this.filterPersona = filterPersona;
                this.commentCount = 0;
                
                this.centerNode = {
                    x: this.centerX, y: this.centerY, radius: 25,
                    color: '#1AE5A1', glow: true, pulse: 0,
                    secondaryPulse: 0
                };

                this.isAnimating = true;
                this.animate();
            }

            addNodeFromComment(comment, persona, sentiment) {
                if (this.nodes.length >= this.maxNodes) {
                    this.nodes.shift();
                }

                const color = PERSONA_COLORS[persona] || PERSONA_COLORS['围观路人'];
                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 30;
                const sentimentStrength = sentiment === 'positive' ? 1 : sentiment === 'neutral' ? 0.6 : 0.3;

                const node = {
                    x: this.centerX + Math.cos(angle) * distance,
                    y: this.centerY + Math.sin(angle) * distance,
                    vx: Math.cos(angle) * 0.4 * sentimentStrength,
                    vy: Math.sin(angle) * 0.4 * sentimentStrength,
                    radius: 8 + sentimentStrength * 6,
                    color: color.hex,
                    gradient: color.gradient,
                    persona: persona,
                    sentiment: sentiment,
                    life: 1,
                    connected: true,
                    comment: comment,
                    createdAt: performance.now(),
                    trail: []
                };

                this.nodes.push(node);
                this.connections.push({
                    from: node,
                    to: this.centerNode,
                    life: 1,
                    width: 1 + sentimentStrength * 1.5
                });

                this.commentCount++;
            }

            animate(currentTime = 0) {
                if (!this.isAnimating) return;

                this.ctx.fillStyle = 'rgba(10, 14, 20, 0.08)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                if (this.centerNode) {
                    this.centerNode.pulse += 0.04;
                    this.centerNode.secondaryPulse += 0.08;
                    
                    const primaryGlow = this.ctx.createRadialGradient(
                        this.centerNode.x, this.centerNode.y, 0,
                        this.centerNode.x, this.centerNode.y, 50
                    );
                    primaryGlow.addColorStop(0, 'rgba(26, 229, 161, 0.4)');
                    primaryGlow.addColorStop(1, 'rgba(26, 229, 161, 0)');
                    this.ctx.fillStyle = primaryGlow;
                    this.ctx.beginPath();
                    this.ctx.arc(this.centerNode.x, this.centerNode.y, 50, 0, Math.PI * 2);
                    this.ctx.fill();

                    const secondaryGlow = this.ctx.createRadialGradient(
                        this.centerNode.x, this.centerNode.y, 0,
                        this.centerNode.x, this.centerNode.y, 30 + Math.sin(this.centerNode.secondaryPulse) * 8
                    );
                    secondaryGlow.addColorStop(0, 'rgba(26, 229, 161, 0.6)');
                    secondaryGlow.addColorStop(1, 'rgba(26, 229, 161, 0)');
                    this.ctx.fillStyle = secondaryGlow;
                    this.ctx.beginPath();
                    this.ctx.arc(this.centerNode.x, this.centerNode.y, 30 + Math.sin(this.centerNode.secondaryPulse) * 8, 0, Math.PI * 2);
                    this.ctx.fill();

                    const centerGradient = this.ctx.createRadialGradient(
                        this.centerNode.x, this.centerNode.y, 0,
                        this.centerNode.x, this.centerNode.y, this.centerNode.radius
                    );
                    centerGradient.addColorStop(0, '#ffffff');
                    centerGradient.addColorStop(0.3, '#1AE5A1');
                    centerGradient.addColorStop(1, '#0f8a65');
                    this.ctx.fillStyle = centerGradient;
                    this.ctx.beginPath();
                    this.ctx.arc(this.centerNode.x, this.centerNode.y, this.centerNode.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                for (let i = this.connections.length - 1; i >= 0; i--) {
                    const conn = this.connections[i];
                    if (!conn.from || !conn.to) {
                        this.connections.splice(i, 1);
                        continue;
                    }

                    const gradient = this.ctx.createLinearGradient(
                        conn.from.x, conn.from.y,
                        conn.to.x, conn.to.y
                    );
                    gradient.addColorStop(0, `rgba(26, 229, 161, ${conn.life * 0.4})`);
                    gradient.addColorStop(1, `rgba(26, 229, 161, ${conn.life * 0.1})`);
                    
                    this.ctx.strokeStyle = gradient;
                    this.ctx.lineWidth = conn.width;
                    this.ctx.lineCap = 'round';
                    this.ctx.beginPath();
                    this.ctx.moveTo(conn.from.x, conn.from.y);
                    this.ctx.lineTo(conn.to.x, conn.to.y);
                    this.ctx.stroke();

                    conn.life *= 0.995;
                    if (conn.life < 0.05) this.connections.splice(i, 1);
                }

                for (let i = this.nodes.length - 1; i >= 0; i--) {
                    const node = this.nodes[i];
                    
                    node.trail.push({ x: node.x, y: node.y, life: 1 });
                    if (node.trail.length > 8) node.trail.shift();

                    node.x += node.vx;
                    node.y += node.vy;
                    node.life *= 0.998;

                    for (let j = node.trail.length - 1; j >= 0; j--) {
                        const trail = node.trail[j];
                        trail.life *= 0.85;
                        if (trail.life < 0.05) node.trail.splice(j, 1);
                    }

                    for (const trail of node.trail) {
                        this.ctx.fillStyle = `rgba(${this.hexToRgb(node.color)}, ${trail.life * 0.3})`;
                        this.ctx.beginPath();
                        this.ctx.arc(trail.x, trail.y, node.radius * 0.6, 0, Math.PI * 2);
                        this.ctx.fill();
                    }

                    const nodeGradient = this.ctx.createRadialGradient(
                        node.x, node.y, 0,
                        node.x, node.y, node.radius * 1.5
                    );
                    nodeGradient.addColorStop(0, node.color);
                    nodeGradient.addColorStop(0.6, node.color);
                    nodeGradient.addColorStop(1, 'transparent');
                    
                    this.ctx.fillStyle = nodeGradient;
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, node.radius * 1.5, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.fillStyle = node.color;
                    this.ctx.globalAlpha = node.life;
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1;

                    if (node.x < -100 || node.x > this.canvas.width + 100 ||
                        node.y < -100 || node.y > this.canvas.height + 100 ||
                        node.life < 0.1) {
                        this.nodes.splice(i, 1);
                        this.connections = this.connections.filter(c => c.from !== node);
                    }
                }

                document.getElementById('activeAgents').textContent = this.nodes.length;
                document.getElementById('networkNodes').textContent = this.nodes.length + 1;

                requestAnimationFrame(() => this.animate(performance.now()));
            }

            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255, 255, 255';
            }

            stop() {
                this.isAnimating = false;
            }
        }

        const canvas = document.getElementById('canvas');
        const nodeAnim = new NetworkAnimation(canvas);
        const startBtn = document.getElementById('startBtn');
        const activityNameInput = document.getElementById('activityName');
        const personaSelect = document.getElementById('persona');
        const nodeCountInput = document.getElementById('nodeCount');
        const nodeCountValue = document.getElementById('nodeCountValue');
        const commentsContainer = document.getElementById('commentsContainer');
        const commentCounter = document.getElementById('commentCounter');
        const statusMessage = document.getElementById('statusMessage');

        nodeCountInput.addEventListener('input', () => {
            nodeCountValue.textContent = nodeCountInput.value;
        });

        function showError(message) {
            statusMessage.innerHTML = `<div class="status-message status-error">${message}</div>`;
            setTimeout(() => statusMessage.innerHTML = '', 8000);
        }

        function showSuccess(message) {
            statusMessage.innerHTML = `<div class="status-message status-success">${message}</div>`;
            setTimeout(() => statusMessage.innerHTML = '', 8000);
        }

        function clearComments() {
            commentsContainer.innerHTML = '';
            document.getElementById('commentCount').textContent = '0';
            commentCounter.textContent = '0 条';
        }

        function addComment(comment) {
            if (commentsContainer.querySelector('.empty-state')) clearComments();

            const persona = comment.persona || Object.keys(PERSONA_COLORS)[Math.floor(Math.random() * 5)];
            const color = PERSONA_COLORS[persona];
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const sentimentWidth = comment.sentiment === 'positive' ? 80 : comment.sentiment === 'neutral' ? 50 : 20;

            const card = document.createElement('div');
            card.className = 'comment-card';
            card.innerHTML = `
                <div class="comment-avatar">${color.emoji}</div>
                <div class="comment-content">
                    <div class="comment-header">
                        <div class="comment-meta">
                            <span class="persona-badge persona-${persona}">${persona}</span>
                            <span class="comment-time">${time}</span>
                        </div>
                    </div>
                    <div class="comment-text">${comment.content || comment.text}</div>
                    <div class="sentiment-indicator">
                        <span class="sentiment-label">${comment.sentiment === 'positive' ? '正面' : comment.sentiment === 'neutral' ? '中性' : '负面'}</span>
                        <div class="sentiment-bar">
                            <div class="sentiment-fill sentiment-${comment.sentiment || 'positive'}" style="width: ${sentimentWidth}%"></div>
                        </div>
                    </div>
                </div>
            `;

            commentsContainer.appendChild(card);
            commentsContainer.scrollTop = commentsContainer.scrollHeight;

            const count = commentsContainer.querySelectorAll('.comment-card').length;
            document.getElementById('commentCount').textContent = count;
            commentCounter.textContent = `${count}条`;

            nodeAnim.addNodeFromComment(comment.content || comment.text, persona, comment.sentiment || 'positive');
        }

        let abortController = null;

        startBtn.addEventListener('click', async () => {
            const activityName = activityNameInput.value.trim();
            const persona = personaSelect.value;
            const nodeCount = parseInt(nodeCountInput.value);

            if (!activityName) { showError('❌ 请输入活动名称'); return; }
            if (nodeCount < 10 || nodeCount > 200) { showError('❌ Agent 数量必须在 10-200 之间'); return; }

            clearComments();
            startBtn.disabled = true;
            startBtn.classList.add('loading');
            startBtn.querySelector('span').textContent = '推演中...';

            nodeAnim.start(nodeCount, persona === 'all' ? null : persona);

            try {
                abortController = new AbortController();
                const timeoutId = setTimeout(() => abortController.abort(), API_TIMEOUT);

                const response = await fetch(`${API_BASE_URL}/api/simulate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        campaign_id: activityName,
                        scenario: persona === 'all' ? 'all' : persona,
                        agents_count: nodeCount
                    }),
                    signal: abortController.signal
                });

                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`服务器错误 (${response.status})`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'complete') {
                                    showSuccess(`✅ 推演完成，共收到 ${data.total || commentsContainer.querySelectorAll('.comment-card').length} 条评论`);
                                    setTimeout(() => nodeAnim.stop(), 2000);
                                } else if (data.content) {
                                    addComment({
                                        content: data.content,
                                        persona: Object.keys(PERSONA_COLORS)[Math.floor(Math.random() * 5)],
                                        sentiment: 'positive'
                                    });
                                }
                            } catch (e) { console.error('Parse error:', e); }
                        }
                    }
                }
            } catch (error) {
                if (error.name === 'AbortError') showError('⏱️ 请求超时，请稍后重试');
                else showError(`❌ ${error.message}`);
                nodeAnim.stop();
            } finally {
                startBtn.disabled = false;
                startBtn.classList.remove('loading');
                startBtn.querySelector('span').textContent = '🚀 开始推演';
            }
        });

        activityNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !startBtn.disabled) startBtn.click();
        });
    </script>
</body>
</html>
